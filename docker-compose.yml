version: '3.8'

services:
  # リバースプロキシ (Nginx)
  nginx:
    image: nginx:alpine
    container_name: vrm-motion-studio-nginx
    ports:
      - "80:80"      # HTTP
      - "443:443"    # HTTPS (将来対応)
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
      - ./public:/usr/share/nginx/html:ro  # 静的ファイル配信用
      - ./frontend/public/vrm:/var/www/vrm:ro  # VRMファイル配信用
    networks:
      - vrm-motion-studio-network
    restart: unless-stopped
    depends_on:
      - frontend
      - backend
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:80"]
      interval: 30s
      timeout: 10s
      retries: 3

  # フロントエンド (Vue.js + Vite)
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: vrm-motion-studio-frontend
    expose:
      - "5174"  # 内部ネットワークのみ
    volumes:
      - ./frontend:/app
      - /app/node_modules
    environment:
      - NODE_ENV=production
      - VITE_API_BASE_URL=/api
    networks:
      - vrm-motion-studio-network
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:5174"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

  # バックエンド (Spring Boot)
  backend:
    build:
      context: ./backend/java
      dockerfile: Dockerfile
    container_name: vrm-motion-studio-backend
    expose:
      - "8081"  # 内部ネットワークのみ
    volumes:
      - ./public:/public  # ファイルサーバと共有
    environment:
      - SPRING_PROFILES_ACTIVE=prod
      - SERVER_PORT=8081
    networks:
      - vrm-motion-studio-network
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:8081/actuator/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s

  # データベース (PostgreSQL)
  database:
    image: postgres:15-alpine
    container_name: vrm-motion-studio-database
    expose:
      - "8083"  # 内部ネットワークのみ
    environment:
      - POSTGRES_DB=${POSTGRES_DB:-vrm_motion_studio}
      - POSTGRES_USER=${POSTGRES_USER:-vrm_studio_user}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD:-changeme}
      - PGPORT=8083
    volumes:
      - postgres-data:/var/lib/postgresql/data
    networks:
      - vrm-motion-studio-network
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U vrm_studio_user -p 8083"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  postgres-data:
    driver: local

networks:
  vrm-motion-studio-network:
    driver: bridge
