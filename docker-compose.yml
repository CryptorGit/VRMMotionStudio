version: '3.8'

services:
  # フロントエンド (Vue.js + Vite)
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: vrm-motion-studio-frontend
    ports:
      - "1301:5174"  # ホストポート:コンテナポート
    volumes:
      - ./frontend:/app
      - /app/node_modules
    environment:
      - NODE_ENV=development
      - VITE_API_BASE_URL=http://localhost:1311
    networks:
      - vrm-motion-studio-network
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:5174"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

  # バックエンド (Spring Boot)
  backend:
    build:
      context: ./backend/java
      dockerfile: Dockerfile
    container_name: vrm-motion-studio-backend
    ports:
      - "1311:8081"  # ホストポート:コンテナポート
    volumes:
      - ./public:/public  # ファイルサーバと共有
    environment:
      - SPRING_PROFILES_ACTIVE=dev
      - SERVER_PORT=8081
    networks:
      - vrm-motion-studio-network
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:8081/actuator/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s

  # データベース (PostgreSQL)
  database:
    image: postgres:15-alpine
    container_name: vrm-motion-studio-database
    ports:
      - "1313:8083"  # ホストポート:コンテナポート (PostgreSQLはコンテナ内で8083で起動)
    environment:
      - POSTGRES_DB=vrm_motion_studio
      - POSTGRES_USER=vrm_studio_user
      - POSTGRES_PASSWORD=vrm_studio_pass
      - PGPORT=8083
    volumes:
      - postgres-data:/var/lib/postgresql/data
    networks:
      - vrm-motion-studio-network
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U vrm_studio_user -p 8083"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ファイルサーバ (静的ファイル配信)
  fileserver:
    image: nginx:alpine
    container_name: vrm-motion-studio-fileserver
    ports:
      - "1314:8084"  # ホストポート:コンテナポート
    volumes:
      - ./public:/usr/share/nginx/html:ro
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
    networks:
      - vrm-motion-studio-network
    restart: unless-stopped

volumes:
  postgres-data:
    driver: local

networks:
  vrm-motion-studio-network:
    driver: bridge
