version: '3.8'

services:
  # フロントエンド (Vue.js + Vite)
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: mokumoku-frontend
    ports:
      - "1301:5174"  # ホストポート:コンテナポート
    volumes:
      - ./frontend:/app
      - /app/node_modules
    environment:
      - NODE_ENV=development
      - VITE_API_BASE_URL=http://localhost:1311
    networks:
      - mokumoku-network
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:5174"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

  # バックエンド (Spring Boot)
  backend:
    build:
      context: ./backend/java
      dockerfile: Dockerfile
    container_name: mokumoku-backend
    ports:
      - "1311:8081"  # ホストポート:コンテナポート
    environment:
      - SPRING_PROFILES_ACTIVE=dev
      - SERVER_PORT=8081
    networks:
      - mokumoku-network
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:8081/actuator/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s

  # ファイルサーバ (静的ファイル配信)
  fileserver:
    image: nginx:alpine
    container_name: mokumoku-fileserver
    ports:
      - "1314:8084"  # ホストポート:コンテナポート
    volumes:
      - ./public:/usr/share/nginx/html:ro
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
    networks:
      - mokumoku-network
    restart: unless-stopped

networks:
  mokumoku-network:
    driver: bridge
